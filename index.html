<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Harness</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family:
                "Microsoft YaHei",
                "微软雅黑",
                "Segoe UI",
                Arial,
                sans-serif;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #22306e;
        }

        .bg {
            position: absolute;
            inset: 0;
            background:
                url(theme-bg.png) center / cover no-repeat,
                #22306e;
            filter: saturate(1.05);
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 52px 64px;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 32px;
            box-shadow: 0 22px 70px rgba(8, 14, 48, 0.42);
        }

        .emblem {
            width: 224px;
            height: 224px;
            object-fit: cover;
            border-radius: 54px;
            box-shadow: 0 12px 34px rgba(8, 14, 48, 0.28);
        }

        h1 {
            margin: 0;
            color: #24327e;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status {
            color: #5a6ba8;
            font-size: 15px;
        }

        .dots::after {
            content: '';
            animation: dots 1.6s steps(1) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '·'; }
            50%  { content: '··'; }
            75%  { content: '···'; }
            100% { content: ''; }
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="card">
        <img class="emblem" src="theme-emblem.png" alt="DeepSeek Harness">
        <h1>DeepSeek Harness</h1>
        <div class="status">正在启动 Harness 服务<span class="dots"></span></div>
    </div>

</body>
</html>
